# Serveur
server.port=8080
server.servlet.context-path=/ivoka-api

# Base de donnees (surcharge possible via .env ou variables d'environnement)
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Pool DBCP2
spring.datasource.dbcp2.initial-size=5
spring.datasource.dbcp2.max-total=20
spring.datasource.dbcp2.max-idle=10
spring.datasource.dbcp2.min-idle=5
spring.datasource.dbcp2.max-wait-millis=10000
spring.datasource.dbcp2.validation-query=SELECT 1
spring.datasource.dbcp2.test-on-borrow=true

# CORS (origines autorisees, separees par des virgules)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}

# Spring Boot ne redirige pas automatiquement vers index.html pour les routes React
# La classe WebConfig s'en charge
spring.web.resources.add-mappings=false

# Comptes initiaux créés au démarrage (si absents en base)
# Surchargeables via .env ou variables d'environnement
init.admin.email=${INIT_ADMIN_EMAIL:admin@ivoka.fr}
init.admin.password=${INIT_ADMIN_PASSWORD:Admin@ivoka2024}
init.admin.firstName=${INIT_ADMIN_FIRST_NAME:Admin}
init.admin.lastName=${INIT_ADMIN_LAST_NAME:IVOKA}

init.user.email=${INIT_USER_EMAIL:user@ivoka.fr}
init.user.password=${INIT_USER_PASSWORD:User@ivoka2024}
init.user.firstName=${INIT_USER_FIRST_NAME:Utilisateur}
init.user.lastName=${INIT_USER_LAST_NAME:Test}

# Logs
logging.level.com.ivoka=INFO
